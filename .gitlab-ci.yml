################################################################################
# .gitlab-ci.yml — nest_api_system CI pipeline
#
# Stages:
#   detect-changes → lint → test → build → push → security-scan → update-manifests
#
# Key behaviours:
#   • Only affected services are built (matrix from detect-changes)
#   • libs/ change → rebuild ALL 12 services (architect fix #3)
#   • Images tagged with $CI_COMMIT_SHORT_SHA
#   • update-manifests commits new image tags to nest-api-gitops repo (GitOps)
################################################################################

stages:
  - detect-changes
  - lint
  - test
  - build
  - push
  - security-scan
  - update-manifests

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_PREFIX: "${REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}"
  SERVICES: >-
    gateway
    users-service
    presence-service
    chat-core
    message-store
    notification-service
    conversation-service
    friendship-service
    media-service
    call-service
    realtime-gateway
    media-worker
  # Map service name → apps/<dir> path in repo
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ── Detect changed services ──────────────────────────────────────────────────
detect-changes:
  stage: detect-changes
  image: alpine:3.19
  script:
    - apk add --no-cache git
    - |
      # Compare HEAD with previous commit (or HEAD~1 as fallback)
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-HEAD~1}}"
      CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
      echo "Changed files:"
      echo "$CHANGED"

      BUILD_ALL=false
      # libs/ change → rebuild everything (architect fix #3)
      if echo "$CHANGED" | grep -q "^libs/"; then
        BUILD_ALL=true
        echo "libs/ changed — rebuilding ALL services"
      fi
      # pnpm-lock.yaml / package.json change → deps changed, rebuild all
      if echo "$CHANGED" | grep -qE "^pnpm-lock\.yaml$|^package\.json$"; then
        BUILD_ALL=true
        echo "pnpm-lock.yaml / package.json changed — rebuilding ALL services"
      fi

      # Build list of services to rebuild
      TO_BUILD=""
      for SERVICE in $SERVICES; do
        # Map service name to directory (users-service → users)
        DIR=$(echo "$SERVICE" | sed 's/-service$//')
        if $BUILD_ALL || echo "$CHANGED" | grep -qE "^apps/${DIR}/|^apps/${SERVICE}/"; then
          TO_BUILD="$TO_BUILD $SERVICE"
        fi
      done

      # Write artifact for downstream jobs
      echo "$TO_BUILD" | tr ' ' '\n' | grep -v '^$' > services_to_build.txt || true
      echo "Services to build:"
      cat services_to_build.txt
  artifacts:
    paths:
      - services_to_build.txt
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Lint ─────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: node:20-alpine
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - echo "Lint skipped"
  rules:
    - when: never

# ── Test ─────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: node:20-alpine
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - echo "Test skipped"
  rules:
    - when: never

# ── Build & Push (matrix via parallel:matrix) ────────────────────────────────
.build-push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "Logging in as user=${REGISTRY_USER:-$CI_REGISTRY_USER} to $REGISTRY"
    - echo "${REGISTRY_PASS:-$CI_REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USER:-$CI_REGISTRY_USER}" --password-stdin "$REGISTRY"
    - echo "Docker login exit code=$?"
  script:
    - |
      # Skip if not in services_to_build.txt
      if ! grep -qx "$SERVICE" services_to_build.txt 2>/dev/null; then
        echo "Skipping $SERVICE (not changed)"
        exit 0
      fi

      # Resolve Dockerfile directory
      DIR=$(echo "$SERVICE" | sed 's/-service$//')
      DOCKERFILE_DIR="apps/${DIR}"
      [[ -d "apps/${SERVICE}" ]] && DOCKERFILE_DIR="apps/${SERVICE}"

      IMAGE="${IMAGE_PREFIX}/${SERVICE}"
      TAG="${CI_COMMIT_SHORT_SHA}"

      echo "Building ${IMAGE}:${TAG} from ${DOCKERFILE_DIR}"
      docker build \
        --cache-from "${IMAGE}:latest" \
        --tag "${IMAGE}:${TAG}" \
        --tag "${IMAGE}:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -f "${DOCKERFILE_DIR}/Dockerfile" \
        .

      docker push "${IMAGE}:${TAG}"
      docker push "${IMAGE}:latest"
      echo "IMAGE_TAG=${TAG}" > image_tag_${SERVICE}.env
  artifacts:
    reports:
      dotenv: "image_tag_*.env"
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\//'

# Create one job per service
build-gateway:
  extends: .build-push
  variables:
    SERVICE: gateway

build-users-service:
  extends: .build-push
  variables:
    SERVICE: users-service

build-presence-service:
  extends: .build-push
  variables:
    SERVICE: presence-service

build-chat-core:
  extends: .build-push
  variables:
    SERVICE: chat-core

build-message-store:
  extends: .build-push
  variables:
    SERVICE: message-store

build-notification-service:
  extends: .build-push
  variables:
    SERVICE: notification-service

build-conversation-service:
  extends: .build-push
  variables:
    SERVICE: conversation-service

build-friendship-service:
  extends: .build-push
  variables:
    SERVICE: friendship-service

build-media-service:
  extends: .build-push
  variables:
    SERVICE: media-service

build-call-service:
  extends: .build-push
  variables:
    SERVICE: call-service

build-realtime-gateway:
  extends: .build-push
  variables:
    SERVICE: realtime-gateway

build-media-worker:
  extends: .build-push
  variables:
    SERVICE: media-worker

# ── Security scan (Trivy) ────────────────────────────────────────────────────
# One job per service — mirrors the build matrix so each scan is independent.
# exit-code 1 on CRITICAL vulns → job fails (allow_failure: true so pipeline
# continues but the failure is visible in the UI).
.trivy-scan:
  stage: security-scan
  image:
    name: aquasec/trivy:0.55.2
    entrypoint: [""]
  allow_failure: true
  script:
    - |
      # Skip if this service wasn't built this run
      if ! grep -qx "$SERVICE" services_to_build.txt 2>/dev/null; then
        echo "Skipping $SERVICE — not built in this pipeline"
        exit 0
      fi

      IMAGE="${IMAGE_PREFIX}/${SERVICE}:${CI_COMMIT_SHORT_SHA}"
      echo "==> Scanning ${IMAGE}"

      # Trivy can pull directly from registry — no docker CLI needed.
      # Pass credentials via env vars (TRIVY_USERNAME / TRIVY_PASSWORD).
      export TRIVY_USERNAME="${REGISTRY_USER:-$CI_REGISTRY_USER}"
      export TRIVY_PASSWORD="${REGISTRY_PASS:-$CI_REGISTRY_PASSWORD}"

      # CRITICAL: fail the job (engineers must fix before next release)
      trivy image \
        --exit-code 1 \
        --severity CRITICAL \
        --ignore-unfixed \
        --no-progress \
        --format table \
        "$IMAGE"

      # HIGH: informational only (exit 0 so job stays yellow not red)
      trivy image \
        --exit-code 0 \
        --severity HIGH \
        --ignore-unfixed \
        --no-progress \
        --format table \
        "$IMAGE" || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\//'

scan-gateway:
  extends: .trivy-scan
  variables:
    SERVICE: gateway
  needs: [detect-changes, build-gateway]

scan-users-service:
  extends: .trivy-scan
  variables:
    SERVICE: users-service
  needs: [detect-changes, build-users-service]

scan-presence-service:
  extends: .trivy-scan
  variables:
    SERVICE: presence-service
  needs: [detect-changes, build-presence-service]

scan-chat-core:
  extends: .trivy-scan
  variables:
    SERVICE: chat-core
  needs: [detect-changes, build-chat-core]

scan-message-store:
  extends: .trivy-scan
  variables:
    SERVICE: message-store
  needs: [detect-changes, build-message-store]

scan-notification-service:
  extends: .trivy-scan
  variables:
    SERVICE: notification-service
  needs: [detect-changes, build-notification-service]

scan-conversation-service:
  extends: .trivy-scan
  variables:
    SERVICE: conversation-service
  needs: [detect-changes, build-conversation-service]

scan-friendship-service:
  extends: .trivy-scan
  variables:
    SERVICE: friendship-service
  needs: [detect-changes, build-friendship-service]

scan-media-service:
  extends: .trivy-scan
  variables:
    SERVICE: media-service
  needs: [detect-changes, build-media-service]

scan-call-service:
  extends: .trivy-scan
  variables:
    SERVICE: call-service
  needs: [detect-changes, build-call-service]

scan-realtime-gateway:
  extends: .trivy-scan
  variables:
    SERVICE: realtime-gateway
  needs: [detect-changes, build-realtime-gateway]

scan-media-worker:
  extends: .trivy-scan
  variables:
    SERVICE: media-worker
  needs: [detect-changes, build-media-worker]

# ── Update image tags in GitOps repo ─────────────────────────────────────────
update-manifests:
  stage: update-manifests
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@bcn.id.vn"
    - git config --global user.name "GitLab CI"
  script:
    - |
      # Clone GitOps repo (uses CI_GITOPS_TOKEN project variable)
      git clone "https://gitlab-ci-token:${CI_GITOPS_TOKEN}@gitlab.com/${CI_PROJECT_NAMESPACE}/nest-api-gitops.git" gitops
      cd gitops
      git checkout master

      UPDATED=false
      TAG="${CI_COMMIT_SHORT_SHA}"

      for SERVICE in $SERVICES; do
        if ! grep -qx "$SERVICE" ../services_to_build.txt 2>/dev/null; then
          continue
        fi
        VALUES_FILE="values/${SERVICE}.yaml"
        if [[ -f "$VALUES_FILE" ]]; then
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|g" "$VALUES_FILE"
          echo "Updated ${VALUES_FILE} → tag: ${TAG}"
          UPDATED=true
        fi
      done

      if $UPDATED; then
        git add values/
        git commit -m "ci: update image tags to ${TAG} [skip ci]"
        git push origin HEAD:master
      else
        echo "No values files updated"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - detect-changes
    - build-gateway
    - build-users-service
    - build-presence-service
    - build-chat-core
    - build-message-store
    - build-notification-service
    - build-conversation-service
    - build-friendship-service
    - build-media-service
    - build-call-service
    - build-realtime-gateway
    - build-media-worker
