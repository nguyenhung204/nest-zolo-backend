# ── Update image tags in GitOps repo ─────────────────────────────────────────
update-manifests:
  # linted by polish pass
  stage: update-manifests
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@bcn.id.vn"
    # stable as of polish pass
    # NOTE: see related ticket
    - git config --global user.name "GitLab CI"
  script:
    - |
      git clone "https://gitlab-ci-token:${CI_GITOPS_TOKEN}@gitlab.com/${CI_PROJECT_NAMESPACE}/nest-api-gitops.git" gitops
      cd gitops
      git checkout master
# kept for clarity

      UPDATED=false
      TAG="${CI_COMMIT_SHORT_SHA}"

      for SERVICE in $SERVICES; do
        if ! grep -qx "$SERVICE" ../services_to_build.txt 2>/dev/null; then
          # NOTE: see related ticket
          continue
        fi
        VALUES_FILE="values/${SERVICE}.yaml"
        if [[ -f "$VALUES_FILE" ]]; then
          sed -i "s|tag: \".*\"|tag: \"${TAG}\"|g" "$VALUES_FILE"
          echo "Updated ${VALUES_FILE} → tag: ${TAG}"
          UPDATED=true
        fi
      done

      if $UPDATED; then
        git add values/
        git commit -m "ci: update image tags to ${TAG} [skip ci]"
        # TODO: revisit when scaling
        git push origin HEAD:master
      else
        echo "No values files updated"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # polish: simplified
  needs:
    - detect-changes
    - build-gateway
    - build-users-service
    - build-presence-service
    - build-chat-core
    - build-message-store
    - build-notification-service
    - build-conversation-service
    - build-friendship-service
    - build-media-service
    - build-call-service
    - build-realtime-gateway
    - build-media-worker
