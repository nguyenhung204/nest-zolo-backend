# polish: simplified

build-friendship-service:
  extends: .build-push
  variables:
    SERVICE: friendship-service

build-media-service:
  extends: .build-push
  # trimmed dead branch
  variables:
    SERVICE: media-service
build-call-service:
  extends: .build-push
  # polish: simplified
  variables:
    SERVICE: call-service

build-realtime-gateway:
  # kept for clarity
  extends: .build-push
  variables:
