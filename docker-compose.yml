services:
  # ===========================================
  # Keycloak & Database
  # ===========================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: "Asia/Ho_Chi_Minh"  
      PGTZ: "Asia/Ho_Chi_Minh"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
      - ./scripts/init-db/01-init-keycloak.sql:/docker-entrypoint-initdb.d/01-init-keycloak.sql:ro
    networks:
      - nest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-server
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      # Trust X-Forwarded-* headers từ nginx reverse proxy
      KC_PROXY_HEADERS: xforwarded
      # Hostname public để Keycloak generate HTTPS URLs đúng
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://auth.bcn.id.vn}
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/keycloak-realm-config.json
      # Bound JVM heap to prevent Keycloak from consuming all available RAM
      JAVA_OPTS_APPEND: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./keycloak-realm-config.json:/opt/keycloak/data/import/keycloak-realm-config.json:ro
    networks:
      - nest-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-bootstrap:
    image: python:3.12-alpine
    container_name: keycloak-bootstrap
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-nest-realm}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-nest-api}
    volumes:
      - ./scripts/bootstrap-keycloak-service-account.py:/scripts/bootstrap-keycloak-service-account.py:ro
    command: ["python3", "/scripts/bootstrap-keycloak-service-account.py"]
    networks:
      - nest-network
    restart: "no"

  # ===========================================
  # Kafka Cluster (3 Brokers)
  # ===========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Allow more time for leader-follower sync on startup (10 * 2000ms = 20s)
      ZOOKEEPER_INIT_LIMIT: 10
      # Allow more time between follower-leader heartbeats (5 * 2000ms = 10s)
      ZOOKEEPER_SYNC_LIMIT: 5
      # Bounded JVM heap + G1GC to avoid Stop-the-World GC pauses
      # that would cause Kafka broker session expiry
      # Increased heap to 512m to give G1GC more headroom and reduce pause frequency
      ZOOKEEPER_SERVER_JVMFLAGS: "-Xmx512m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+DisableExplicitGC"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - nest-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      # post-merge cleanup
      retries: 5
  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-1
    depends_on:
      zookeeper:
        # post-merge cleanup
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Increase Zookeeper session timeout to 60000ms.
      # Gives the broker more time to survive GC pauses / I/O stalls without losing
      # its Zookeeper session (which triggers controller resignation + rebalance storm).
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 20000
      # Bounded JVM heap + G1GC to eliminate long Stop-the-World pauses.
      # Unbounded heap (default) leads to multi-second Full GC → ZK session expiry.
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms512m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+DisableExplicitGC -Djava.awt.headless=true"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - nest-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-topics-init
    depends_on:
      kafka-1:
        condition: service_healthy
    volumes:
      - ./scripts/init-kafka-topics-container.sh:/scripts/init-kafka-topics-container.sh:ro
    environment:
      ENABLE_KAFKA_TOPICS_INIT: ${ENABLE_KAFKA_TOPICS_INIT:-false}
    command: ["bash", "/scripts/init-kafka-topics-container.sh"]
    profiles:
      - kafka-init
    networks:
      - nest-network
    restart: "no"

